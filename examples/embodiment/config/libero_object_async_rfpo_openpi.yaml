defaults:
  - env/libero_object@env.train
  - model/pi0_rfpo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_async_rfpo_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 20000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 40
  weight_sync_interval: 30

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 30
  adv_type: embodied_sac
  loss_type: embodied_rfpo
  loss_agg_func: "token-mean"

  backup_entropy: False
  critic_actor_ratio: 4

  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    target_entropy: -32
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 10
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    rollout_epoch: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: False
    use_only_first_success: True
    use_rel_reward: False
    use_step_penalty: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    model_path: "/path/to/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT" # https://huggingface.co/RLinf/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT
    num_action_chunks: 5
    action_dim: 7

    openpi:
      noise_method: "flow_ode"

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

weight_syncer:
  patch:
    init_sync:
      enabled: True
      prefixes: ["residual_actor"]

reward:
  use_reward_model: False

critic:
  use_critic_model: False
