defaults:
  - rfpo_pi0_backbone
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_rfpo_openpi"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  group_size: 1
  reward_type: chunk_level
  adv_type: embodied_sac
  loss_type: embodied_rfpo
  loss_agg_func: token-mean
  update_epoch: 1
  bootstrap_type: standard
  gamma: 0.99
  critic_subsample_size: 2
  tau: 0.005
  target_update_type: all
  target_update_freq: 1
  backup_entropy: False
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 1
    auto_save: False

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: False
    use_only_first_success: True
    use_rel_reward: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: False
    is_eval: True
    video_cfg:
      save_video: False

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  collect_final_values: False
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 2
  seed: 42
  enable_offload: False
  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
