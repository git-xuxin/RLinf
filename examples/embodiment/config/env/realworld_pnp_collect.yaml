env_type: realworld

total_num_envs: null

auto_reset: False
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 150
max_episode_steps: 150
use_spacemouse: True
no_gripper: False  # 7DOF: 6 ee + 1 gripper
keyboard_reward_wrapper: single_stage  # keyboard reward for done/success signal
main_image_key: wrist_1

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "FrankaBinRelocationEnv-v1"
  num_envs: null

