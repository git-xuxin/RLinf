defaults:
  - env/realworld_pnp_collect@env.eval
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: franka
      node_ranks: 0
      hardware:
        type: Franka
        configs:
          - robot_ip: ROBOT_IP
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data-pnp"
    logger_backends: ["tensorboard"] # wandb, swanlab
  num_data_episodes: 20
  record_task_description: False
  task_description: ""  # Custom task description e.g. "Pick up the red pepper doll from the table and place it on the blue plate" (optional, will use env default if not set)

env:
  group_name: "EnvGroup"
  eval:
    ignore_terminations: False
    auto_reset: False
    use_spacemouse: True
    no_gripper: False  # 7DOF: 6 ee + 1 gripper
    keyboard_reward_wrapper: single_stage  # keyboard: 'c' = success(reward=1, done)
    override_cfg:
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]  # Replace with your target end-effector pose
      camera_serials: ["CAMERA_SERIAL1", "CAMERA_SERIAL2"]  # Replace with your actual camera serial numbers (dual cameras)
      use_dense_reward: False
      is_dummy: false
      max_num_steps: 150
      enable_gripper_penalty: False
