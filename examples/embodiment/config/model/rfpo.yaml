model_type: openpi_rfpo
precision: fp32
is_lora: False

sampler:
  rfpo_action_chunk: 20
  active_step_indices: [0, 1, 2]  # support [0, 1, 2, 3]

# Small networks only; the worker loads pi from rfpo_backbone_model.
actor:
  hidden_size: 256
  num_dit_blocks: 3
  num_heads: 2
  mlp_ratio: 2.0
  init_log_std: -6.0

critic:
  hidden_size: 384
  num_hidden_layers: 3
  num_heads: 2
  mlp_ratio: 2.0
  num_q_heads: 10
