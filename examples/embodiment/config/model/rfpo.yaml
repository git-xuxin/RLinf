model_type: openpi_rfpo
precision: fp32
is_lora: False
num_action_chunks: ${actor.rfpo_backbone_model.num_action_chunks}
action_dim: 7

sampler:
  rfpo_action_chunk: ${..num_action_chunks}
  active_step_indices: [0, 1, 2]  # Zero-based pi denoising steps with residual guidance.

# Trainable networks; each worker loads frozen pi from rfpo_backbone_model.
actor:
  hidden_size: 256
  num_dit_blocks: 3
  num_decoder_layers: 1
  num_heads: 2
  mlp_ratio: 2.0
  init_log_std: -6.0

critic:
  hidden_size: 384
  num_hidden_layers: 3
  num_heads: 2
  mlp_ratio: 2.0
  num_q_heads: 10
