defaults:
  - pi0
  - _self_

model_type: "openpi_rfpo"

rfpo:
  # Active RFPO region; pi0 still denoises its full model action tensor.
  rfpo_action_chunk: ${..num_action_chunks}
  rfpo_action_dim: ${..action_dim}

  # Fixed per-sample RMS limit in the normalized pi0 velocity space.
  max_residual_velocity_rms: 0.2
  num_denoise_steps: ${..num_steps}
  active_step_indices: [0, 1, 2, 3]
  differentiate_base_velocity: True

  initial_log_std: -4.0
  min_log_std: -8.0
  max_log_std: 0.0
  internal_log_prob_reduction: "mean_active"

  dit_hidden_size: 512
  dit_depth: 4
  dit_num_heads: 8
  dit_mlp_ratio: 2.0

  condition_decoder_num_layers: 2
  condition_decoder_num_heads: 8
  condition_decoder_mlp_ratio: 2.0
  timestep_frequency_embedding_size: 256

  critic_gemma3:
    hidden_size: 512
    intermediate_size: 1024
    num_hidden_layers: 3
    num_attention_heads: 8
    num_key_value_heads: 4
    head_dim: 64
    max_position_embeddings: 1024
    attention_dropout: 0.0
    hidden_activation: "gelu_pytorch_tanh"
    initializer_range: 0.02
    rms_norm_eps: 1.0e-6
    rope_theta: 1000000.0

  critic_prefix_length: 816
  critic_mlp_hidden_dims: [256, 128]
  critic_q_output_init_std: 1.0e-3

  context_dim: 2048
  dropout: 0.0
