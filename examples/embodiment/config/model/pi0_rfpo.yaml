defaults:
  - pi0
  - _self_

model_type: "openpi_rfpo"

rfpo:
  # Active RFPO region; pi0 still denoises its full model action tensor.
  rfpo_action_chunk: ${..num_action_chunks}
  rfpo_action_dim: ${..action_dim}

  # Fixed per-sample RMS limit in the normalized pi0 velocity space.
  max_residual_velocity_rms: 0.2
  num_denoise_steps: ${..num_steps}
  active_step_indices: [0, 1, 2, 3]
  differentiate_base_velocity: True

  initial_log_std: -4.0
  min_log_std: -8.0
  max_log_std: 0.0
  internal_log_prob_reduction: "mean_active"

  actor_hidden_size: 512
  actor_num_layers: 3
  actor_num_heads: 8
  actor_mlp_ratio: 4.0

  critic_transformer:
    d_model: 512
    nhead: 8
    num_encoder_layers: 6
    num_decoder_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
    activation: relu
    norm_first: false
  critic_mlp_hidden_dims: [512, 256]

  context_dim: 2048
  dropout: 0.0
