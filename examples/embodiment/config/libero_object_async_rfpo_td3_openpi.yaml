defaults:
  - env/libero_object@env.train
  - env/libero_object@env.eval
  - model/rfpo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout, actor: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_async_rfpo_td3_openpi"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null  # checkpoints/global_step_<N>
  ckpt_path: null  # actor/model_state_dict/full_weights.pt; weights only

algorithm:
  group_size: 1
  reward_type: chunk_level
  adv_type: embodied_td3
  loss_type: embodied_rfpo_td3
  loss_agg_func: token-mean
  update_epoch: 8
  critic_actor_ratio: 2
  train_actor_steps: 40  # Replay trajectory threshold per rank for actor updates.
  bootstrap_type: standard
  gamma: 0.99
  critic_subsample_size: 2
  tau: 0.05

  # L2 weights for residual means, averaged over guided steps and action positions.
  raw_mean_l2_coefficients:
    translation: 1.0e-2
    rotation: 1.0e-2
    gripper: 1.0e-2

  target_update_freq: 1
  target_actor_update_freq: 1
  target_noise_std: 0.01
  target_noise_clip: 0.02
  replay_buffer:
    enable_cache: True
    cache_size: 100
    sample_window_size: 100
    min_buffer_size: 10
    auto_save: False

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    ignore_terminations: False
    use_only_first_success: True
    use_rel_reward: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    specific_reset_id: 0
    use_ordered_reset_state_ids: False
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 40
    auto_reset: True
    ignore_terminations: False
    is_eval: True
    specific_reset_id: 0
    use_ordered_reset_state_ids: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False

rollout:
  group_name: RolloutGroup
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  collect_final_values: False
  enable_torch_compile: False
  enable_cuda_graph: False

  model: ${actor.model}
  rfpo_backbone_model: ${actor.rfpo_backbone_model}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42
  enable_offload: False

  model:
    actor:
      deterministic: True
    sampler:
      exploration_noise_std: 0.01

  rfpo_backbone_model:
    model_type: openpi
    model_path: /mnt/public2/ysa/ckpt/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT
    precision: bf16
    pi05: False
    num_action_chunks: 20
    action_dim: 7
    num_steps: 4
    openpi:
      task: eval
      config_name: pi0_libero
      action_horizon: ${..num_action_chunks}
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      num_steps: ${..num_steps}
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 48
      discrete_state_input: False
      torch_compile: False
    openpi_data:
      norm_stats_path: ${..model_path}/physical-intelligence/libero/norm_stats.json

  optim:
    clip_grad: 1.0
    lr: 1.0e-05
    lr_scheduler: constant
    lr_warmup_steps: 50

  critic_optim:
    clip_grad: 1.0
    lr: 1.0e-05
    lr_scheduler: torch_constant

  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
